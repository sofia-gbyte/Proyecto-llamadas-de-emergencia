# Puerto del servidor que entrega la interfaz CODES y la API REST.
server.port=${CODES_SERVER_PORT:8000}
# Por defecto solo acepta conexiones desde este equipo. Para una red interna,
# define CODES_SERVER_ADDRESS con la IP privada concreta del equipo servidor.
server.address=${CODES_SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Base de datos: H2 en archivo local (no requiere servidor externo,
# y evita el problema de que Hibernate no tiene dialecto oficial para
# SQLite). El archivo queda en data/llamadas.mv.db.
spring.datasource.url=jdbc:h2:file:./data/llamadas;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Carpetas del sistema de archivos (ver ArchivosConfig)
app.audio-crudo-dir=./data/audios_crudos
app.audio-encriptado-dir=./data/audios_encriptados
app.geocache-path=./data/geocache.json
app.log-auditoria-path=./logs/auditoria.log
# Diccionario generado desde OpenStreetMap. Si no existe, CODES conserva la transcripcion ASR sin cambios.
app.calles-diccionario=./data/calles_chile.txt

# Clave de cifrado AES para los audios. En producción: NO dejarla aquí,
# pasarla como variable de entorno CODES_ENCRYPT_KEY (ver
# SeguridadService) y quitar esta línea o dejarla vacía.
app.encrypt-key=${CODES_ENCRYPT_KEY:}

# Secreto de firma de los JWT de sesión (HMAC-SHA256, generar con
# JwtService.generarSecreto()). Distinto de app.encrypt-key a propósito:
# nunca reutilizar una misma clave para dos propósitos criptográficos.
app.jwt-secret=${CODES_JWT_SECRET:}
# Duración de la sesión: 480 min = 8 horas = un turno.
app.jwt-expiracion-minutos=480

# Bootstrap del primer administrador. Ver AdminSeederRunner: solo se usa
# una vez, cuando la base de datos no tiene ningún usuario todavía.
# Después del primer arranque exitoso, puedes quitar la variable de
# entorno de la contraseña del entorno del sistema.
app.admin-bootstrap-user=${CODES_ADMIN_USER:}
app.admin-bootstrap-password=${CODES_ADMIN_PASSWORD:}

# Orígenes permitidos para CORS: SOLO las IPs/hostnames reales de los
# computadores de la sala, nunca "*". Ejemplo con dos PCs de la sala:
# app.cors-allowed-origins=http://192.168.1.10:8000,http://192.168.1.11:8000
# Por defecto se deja abierto solo a localhost para que el proyecto
# arranque out-of-the-box en desarrollo; CAMBIAR antes de producción.
app.cors-allowed-origins=http://localhost:8000,http://127.0.0.1:8000

# Cloudflare Turnstile. La clave secreta solo vive en el entorno del servidor.
app.turnstile-site-key=${CODES_TURNSTILE_SITE_KEY:}
app.turnstile-secret-key=${CODES_TURNSTILE_SECRET_KEY:}


# Geocodificación
app.geocoder.pais=Chile
app.geocoder.user-agent=CODES-CENCO/1.0 (uso interno)

logging.level.root=INFO

# Las respuestas de la API contienen datos operativos sensibles.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ASR local con sherpa-onnx.
app.asr.auto-start=true
app.asr.root=./tools/asr
app.asr.model-name=sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11
# La llamada EN VIVO usa WebSocket en ws://localhost:6006 y no pasa por este CLI.
# Estas rutas sirven para los audios completos que llegan a data/audios_crudos/.
app.asr.command=sherpa-onnx
app.asr.idioma=es-ES
app.asr.hilos=2
app.asr.encoder=./tools/asr/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11/encoder.int8.onnx
app.asr.decoder=./tools/asr/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11/decoder.int8.onnx
app.asr.joiner=./tools/asr/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11/joiner.int8.onnx
app.asr.tokens=./tools/asr/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11/tokens.txt
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

